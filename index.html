<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#191410" />
    <title>منوی چایخانه آقاجون</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="site-header"></header>

    <main class="menu" aria-label="منوی چایخانه آقاجون">
      <video
        class="menu-video"
        src="./assets/menu-1.mp4"
        aria-label="بخش اول منو"
        autoplay
        muted
        loop
        playsinline
      ></video>

      <hr class="menu-divider" />

      <video
        class="menu-video"
        src="./assets/menu-2.mp4"
        aria-label="بخش دوم منو"
        autoplay
        muted
        loop
        playsinline
      ></video>
    </main>

    <footer class="site-footer">
      <img class="logo" src="./assets/logo.png" alt="چایخانه آقاجون" />
      <a
        class="instagram-link"
        href="https://www.instagram.com/chaykhaneh_aghajoon/"
      >
        <span class="instagram-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle
              cx="17.4"
              cy="6.7"
              r="1"
              fill="currentColor"
              stroke="none"
            ></circle>
          </svg>
        </span>

        <span class="instagram-copy">
          <strong>اینستاگرام آقاجون</strong>
          <bdi dir="ltr">@chaykhaneh_aghajoon</bdi>
        </span>
      </a>
    </footer>
  </body>
</html>
